<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; width: 320px; margin: 12px; color: #1f2328; }
    h1 { font-size: 15px; margin: 0 0 6px; }
    p { margin: 6px 0; }
    .muted { color: #59636e; font-size: 12px; }
    button { width: 100%; padding: 8px; margin-top: 8px; border: 0; border-radius: 6px; background: #f5a623;
             color: #1f2328; font-weight: 600; cursor: pointer; }
    button.secondary { background: #e7e9ec; font-weight: 500; }
    button:disabled { opacity: .5; cursor: default; }
    #status { margin-top: 10px; padding: 8px; border-radius: 6px; background: #f2f4f6; display: none; white-space: pre-wrap; }
    #status.ok { background: #e6f4ea; }
    #status.warn { background: #fff4e5; }
    #preview { max-height: 90px; overflow: auto; font-size: 11px; background: #f6f8fa; padding: 6px; border-radius: 4px; display: none; }
  </style>
</head>
<body>
  <h1>MotorSift Capture</h1>
  <p class="muted">Highlight the listing details you want (or press Ctrl+A / Cmd+A for the whole listing), then send.
     Only your selection, the page title, URL and preview image link are sent, and only to this computer (127.0.0.1).</p>
  <div id="preview"></div>
  <button id="send">Send selection</button>
  <button id="copy" class="secondary">Copy for pasting into the app</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
